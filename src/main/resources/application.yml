server:
  port: ${SERVER_PORT:8080}
spring:
  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:learning_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mysecretpassword}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        transaction:
          jta:
            platform: none
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
springdoc:
  api-docs:
    enabled: true
