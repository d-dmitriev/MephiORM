server:
  port: ${SERVER_PORT:8080}
spring:
  profiles:
    active: ${SPRING_ACTIVE_PROFILE:dev}
  main:
    banner-mode: off

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        transaction:
          jta:
            platform: none
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always