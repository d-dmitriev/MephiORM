spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:learning_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mysecretpassword}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL:update}
  sql:
    init:
      mode: ${DB_INIT:never}
springdoc:
  api-docs:
    enabled: ${API_DOC_ENABLED:false}